name: Refresh public company data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: public-financial-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore immutable public SEC filing cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tickerlantern-sec-raw
          key: tickerlantern-sec-filings-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: tickerlantern-sec-filings-v1-${{ runner.os }}-
      - name: Stage last-known public batch
        run: |
          mkdir -p "$RUNNER_TEMP/tickerlantern-data-stage"
          cp data/*.json "$RUNNER_TEMP/tickerlantern-data-stage/"
      - name: Refresh public financial facts
        env:
          PUBLIC_DATA_OUTPUT: ${{ runner.temp }}/tickerlantern-data-stage
          SEC_RAW_CACHE: ${{ runner.temp }}/tickerlantern-sec-raw
        run: node refresh.mjs
      - name: Publish verified batch
        run: |
          cp "$RUNNER_TEMP/tickerlantern-data-stage/"*.json data/
          git config user.name "TickerLantern data refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh dated public financial snapshots"
          git push
